name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build backend artifact
        working-directory: backend
        run: |
          mkdir -p bin
          go build -o bin/dblive-server ./cmd/server
          tar -czf ../dblive-backend-linux.tar.gz -C bin dblive-server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend artifact
        working-directory: frontend
        run: |
          npm install
          npm run build
          cd dist
          zip -r ../../dblive-frontend.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dblive-backend-linux.tar.gz
            dblive-frontend.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dblive:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dblive:latest
