name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Backend test
        working-directory: backend
        run: go test ./...

      - name: Backend build
        working-directory: backend
        run: |
          mkdir -p bin
          go build -o bin/dblive-server ./cmd/server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend install
        working-directory: frontend
        run: npm install

      - name: Frontend build
        working-directory: frontend
        run: npm run build

