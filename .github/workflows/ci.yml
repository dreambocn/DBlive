name: ci

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Backend test
        working-directory: backend
        run: go test ./...

      - name: Backend build
        working-directory: backend
        run: |
          mkdir -p bin
          go build -o bin/dblive-server ./cmd/server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build backend artifact
        working-directory: backend
        run: |
          mkdir -p bin
          go build -o bin/dblive-server ./cmd/server
          tar -czf ../dblive-backend-linux.tar.gz -C bin dblive-server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend artifact
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cd dist
          zip -r ../../dblive-frontend.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dblive-backend-linux.tar.gz
            dblive-frontend.zip
